<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwiftWatchesMovies</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-logo">🎬</span>
      <span class="brand-name">Swift<span>Watches</span>Movies</span>
    </div>

    <nav class="mode-tabs" id="mode-tabs" aria-label="Content type">
      <button class="mode-tab active" data-mode="movies"><span class="mode-ico">🎬</span> Movies</button>
      <button class="mode-tab" data-mode="anime"><span class="mode-ico">🌸</span> Anime</button>
    </nav>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="search" type="search" placeholder="Search…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list" />
      <div id="suggestions" class="suggestions hidden" role="listbox"></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">Genres</div>
      <nav id="genre-list" class="genre-list" aria-label="Genres"></nav>
    </aside>

    <main class="container">
      <h2 id="section-title" class="section-title"></h2>
      <div id="status" class="status"></div>
      <div id="results" class="grid" aria-live="polite"></div>
      <div id="feed-end" class="feed-end hidden">You've reached the end.</div>
    </main>
  </div>

  <!-- Fullscreen player modal -->
  <div id="player-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-inner">
      <div class="modal-head">
        <div class="modal-title" id="modal-title"></div>

        <div id="tv-controls" class="tv-controls hidden">
          <label id="season-wrap">Season
            <select id="season-select"></select>
          </label>
          <label id="episode-wrap">Episode
            <select id="episode-select"></select>
          </label>
          <button id="play-episode" class="play-btn">▶ Play</button>
        </div>

        <div class="head-actions">
          <label class="source-picker" id="source-picker">Server
            <select id="source-select" title="Switch streaming source"></select>
          </label>
          <button class="text-btn" id="adblock-btn" title="Block pop-up and redirect ads. Turn off if a source won't play.">🛡 Ad-block: On</button>
          <button class="text-btn" id="fullscreen-btn" title="Toggle fullscreen">⛶ Fullscreen</button>
          <button class="icon-btn" id="close-modal" aria-label="Close">✕</button>
        </div>
      </div>

      <div class="player-frame" id="player-frame">
        <div id="player-loading" class="player-loading">Loading player…</div>
        <iframe
          id="player"
          allowfullscreen
          allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
          referrerpolicy="origin"
        ></iframe>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
